# Build and package Regard3D.
#
# Windows: clang (GNU-style driver, MSVC ABI, ThinLTO) against the vcpkg
# dependencies (triplet x64-windows, built with MSVC), packaged as an NSIS
# installer and a portable zip.
# Linux: clang (ThinLTO) against the static vcpkg dependencies (triplet
# x64-linux, built with GCC) and the system's GTK 3, packaged as an AppImage.
# macOS follows.
#
# Nothing but Regard3D itself is built here. OpenMVG and the external tools
# come from the GitHub releases of their own repositories, pinned below:
# OpenMVG as a full installation that find_package(OpenMVG) uses (and whose
# openMVG_main_* programs are shipped), the tools as ready-made programs.
#
# Pushing a tag v* additionally creates a draft GitHub release with the
# packages.

name: build

on:
  push:
    # ci/*: to try a change to the build without a pull request
    branches: [master, develop, 'ci/**']
    tags: ['v*']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same LLVM as the OpenMVG fork's CI, whose static libraries are linked
  LLVM_VERSION: 22.1.2
  # Releases of the dependencies and tools (tag in github.com/rhiestan/<repo>)
  OPENMVG_TAG: v0.1.2
  CMVS_PMVS_TAG: v0.1.0
  MVE_TAG: v0.1.0
  SMVS_TAG: v0.1.0
  POISSONRECON_TAG: v0.1.0
  MVS_TEXTURING_TAG: v0.1.0
  DEJAVU_VERSION: '2.37'

jobs:
  windows:
    name: windows-x64
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      # Not PLATFORM: msvc-dev-cmd sets Platform=x64, and Windows environment
      # variable names ignore case
      R3D_PLATFORM: windows-x64
      VCPKG_TRIPLET: x64-windows

    steps:
      - uses: actions/checkout@v4

      - name: Package name
        run: bash .github/ci/package-name.sh

      # --- Toolchain ------------------------------------------------------------

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc

      - name: Download LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          archive="clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/$archive"
          7z x "$RUNNER_TEMP/$archive" -so | 7z x -si -ttar -o'C:\llvm' > /dev/null
          rm "$RUNNER_TEMP/$archive"

      # The Windows SDK, the MSVC STL and runtime libraries, and Ninja. Also
      # puts Visual Studio's own clang on the path, so LLVM is referred to by
      # absolute paths below.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Paths
        run: |
          echo "LLVM_DIR=C:/llvm/clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc" >> "$GITHUB_ENV"
          echo "DEPS_DIR=$(cygpath -m "$RUNNER_TEMP")/deps" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=$(cygpath -m "$RUNNER_TEMP")/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLED=$(cygpath -m "$RUNNER_TEMP")/vcpkg_installed" >> "$GITHUB_ENV"
          echo "VCPKG_ARCHIVES=$(cygpath -m "$RUNNER_TEMP")/vcpkg_archives" >> "$GITHUB_ENV"
          echo "VCPKG_BASELINE=$(jq -r '."builtin-baseline"' src/vcpkg.json)" >> "$GITHUB_ENV"

      # --- vcpkg dependencies ------------------------------------------------------

      # The baseline commit of src/vcpkg.json, with history: vcpkg looks up
      # port versions in git.
      - name: Check out vcpkg
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --quiet "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      # vcpkg binary cache: the built packages as zip files. The key contains
      # the MSVC version, which is part of every package's ABI hash; the
      # restore keys reuse what still matches after a change.
      - name: Restore the vcpkg binary cache
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_ARCHIVES }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCToolsVersion }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('src/vcpkg.json', 'src/vcpkg-configuration.json', 'src/vcpkg-overlay-ports/**') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCToolsVersion }}-${{ env.VCPKG_BASELINE }}-
            vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCToolsVersion }}-
            vcpkg-${{ env.VCPKG_TRIPLET }}-

      - name: Install the vcpkg dependencies
        run: |
          mkdir -p "$VCPKG_ARCHIVES"
          export VCPKG_BINARY_SOURCES="clear;files,$VCPKG_ARCHIVES,readwrite"
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=src \
            --x-install-root="$VCPKG_INSTALLED" \
            --triplet="$VCPKG_TRIPLET" --clean-after-build --disable-metrics

      # Saved even if a later step fails, so that a rerun does not rebuild
      # the dependencies.
      - name: Save the vcpkg binary cache
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_ARCHIVES }}
          key: ${{ steps.cache-vcpkg.outputs.cache-primary-key }}

      - name: Upload the vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ env.R3D_PLATFORM }}
          path: ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
          if-no-files-found: ignore

      # --- OpenMVG, tools, resources --------------------------------------------------

      - name: Download OpenMVG and the external tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/download-deps.sh

      # --- Regard3D -----------------------------------------------------------------

      # As build_regard3d_clang.bat in the workspace:
      # CMP0091=NEW: the project's cmake_minimum_required(3.10) leaves the
      #   MSVC runtime policy at OLD, so clang's GNU driver would link the
      #   static CRT against the /MD vcpkg packages.
      # OpenMP_libomp_LIBRARY: LLVM's libomp, which OpenMVG uses as well.
      # -C 1252: regard3d.rc holds a Latin-1 copyright sign, which llvm-rc
      #   rejects without a code page.
      - name: Configure
        run: |
          opt="-O3 -DNDEBUG -flto=thin"
          cmake -Wno-dev -G Ninja -S src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM_DIR/bin/clang.exe" \
            -DCMAKE_CXX_COMPILER="$LLVM_DIR/bin/clang++.exe" \
            -DCMAKE_AR="$LLVM_DIR/bin/llvm-ar.exe" \
            -DCMAKE_RANLIB="$LLVM_DIR/bin/llvm-ranlib.exe" \
            -DCMAKE_RC_COMPILER="$LLVM_DIR/bin/llvm-rc.exe" \
            -DCMAKE_RC_FLAGS="-C 1252" \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DOpenMP_libomp_LIBRARY="$LLVM_DIR/lib/libomp.lib" \
            -DCMAKE_C_FLAGS_RELEASE="$opt" \
            -DCMAKE_CXX_FLAGS_RELEASE="$opt" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED" \
            -DOpenMVG_DIR="$DEPS_DIR/openmvg/lib/openMVG/cmake"

      - name: Build
        run: cmake --build build --parallel

      # --- Packages -------------------------------------------------------------------

      - name: Stage
        run: bash .github/ci/stage-windows.sh

      - name: Check the DLL dependencies
        run: bash .github/ci/check-windows-deps.sh "$STAGE_DIR"

      - name: Installer and zip
        run: bash .github/ci/package-windows.sh

      # One artifact per package, uploaded as is (archive: false): the
      # artifact is the file itself, named after it, not a zip around it
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.PKG_NAME }}-setup.exe
          archive: false
          if-no-files-found: error

      - name: Upload the portable zip
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.PKG_NAME }}.zip
          archive: false
          if-no-files-found: error

  linux:
    name: linux-x64
    # The oldest hosted runner: the AppImage runs on distributions with at
    # least its glibc (2.35), as do the OpenMVG and tool releases, which are
    # built on it as well
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      R3D_PLATFORM: linux-x64
      VCPKG_TRIPLET: x64-linux

    steps:
      - uses: actions/checkout@v4

      - name: Package name
        run: bash .github/ci/package-name.sh

      # --- Toolchain ------------------------------------------------------------

      # Build tools of the vcpkg ports, and the system libraries they and
      # Regard3D use: X11, OpenGL and GTK 3 (src/vcpkg-overlay-ports)
      - name: System packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake bison flex gperf libtool \
            nasm ninja-build pkg-config python3-venv patchelf \
            libgtk-3-dev libgl-dev libglu1-mesa-dev libegl-dev \
            libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxxf86vm-dev libxtst-dev libsm-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ~/llvm
          key: llvm-${{ env.LLVM_VERSION }}-Linux-X64

      - name: Download LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          archive="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/$archive"
          mkdir -p ~/llvm
          tar -C ~/llvm -xJf "$RUNNER_TEMP/$archive"
          rm "$RUNNER_TEMP/$archive"

      - name: Paths
        run: |
          echo "LLVM_DIR=$HOME/llvm/LLVM-${LLVM_VERSION}-Linux-X64" >> "$GITHUB_ENV"
          echo "DEPS_DIR=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLED=$RUNNER_TEMP/vcpkg_installed" >> "$GITHUB_ENV"
          echo "VCPKG_ARCHIVES=$RUNNER_TEMP/vcpkg_archives" >> "$GITHUB_ENV"
          echo "VCPKG_BASELINE=$(jq -r '."builtin-baseline"' src/vcpkg.json)" >> "$GITHUB_ENV"
          # Part of every package's ABI hash, as the MSVC version on Windows
          echo "GCC_VERSION=$(gcc -dumpfullversion)" >> "$GITHUB_ENV"

      # --- vcpkg dependencies ------------------------------------------------------

      - name: Check out vcpkg
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --quiet "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore the vcpkg binary cache
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_ARCHIVES }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-gcc${{ env.GCC_VERSION }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('src/vcpkg.json', 'src/vcpkg-configuration.json', 'src/vcpkg-overlay-ports/**') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TRIPLET }}-gcc${{ env.GCC_VERSION }}-${{ env.VCPKG_BASELINE }}-
            vcpkg-${{ env.VCPKG_TRIPLET }}-gcc${{ env.GCC_VERSION }}-
            vcpkg-${{ env.VCPKG_TRIPLET }}-

      - name: Install the vcpkg dependencies
        run: |
          mkdir -p "$VCPKG_ARCHIVES"
          export VCPKG_BINARY_SOURCES="clear;files,$VCPKG_ARCHIVES,readwrite"
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=src \
            --x-install-root="$VCPKG_INSTALLED" \
            --triplet="$VCPKG_TRIPLET" --clean-after-build --disable-metrics

      - name: Save the vcpkg binary cache
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_ARCHIVES }}
          key: ${{ steps.cache-vcpkg.outputs.cache-primary-key }}

      - name: Upload the vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ env.R3D_PLATFORM }}
          path: ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
          if-no-files-found: ignore

      # --- OpenMVG, tools, resources --------------------------------------------------

      - name: Download OpenMVG and the external tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/download-deps.sh

      # --- Regard3D -----------------------------------------------------------------

      # OpenMP_omp_LIBRARY: LLVM's libomp, bundled in the AppImage. Clang's
      #   -fopenmp links "omp", which FindOpenMP looks for only in the
      #   compiler's implicit link directories; without it, OpenMVGConfig.cmake
      #   would take the (older) libomp shipped with OpenMVG.
      # -static-libstdc++: the AppImage then does not depend on the host's
      #   C++ runtime being at least as new as Ubuntu 22.04's
      - name: Configure
        run: |
          opt="-O3 -DNDEBUG -flto=thin"
          libomp="$(find "$LLVM_DIR/lib" -name libomp.so -print -quit)"
          if [[ -z "$libomp" ]]; then
            echo "::error::libomp.so not found in $LLVM_DIR/lib"
            exit 1
          fi
          echo "libomp: $libomp"
          cmake -Wno-dev -G Ninja -S src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM_DIR/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_DIR/bin/clang++" \
            -DCMAKE_AR="$LLVM_DIR/bin/llvm-ar" \
            -DCMAKE_RANLIB="$LLVM_DIR/bin/llvm-ranlib" \
            -DOpenMP_omp_LIBRARY="$libomp" \
            -DCMAKE_C_FLAGS_RELEASE="$opt" \
            -DCMAKE_CXX_FLAGS_RELEASE="$opt" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -static-libstdc++ -static-libgcc -Wl,--as-needed" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED" \
            -DOpenMVG_DIR="$DEPS_DIR/openmvg/lib/openMVG/cmake"

      - name: Build
        run: cmake --build build --parallel

      # --- Package --------------------------------------------------------------------

      - name: Stage
        run: bash .github/ci/stage-linux.sh

      - name: Check the library dependencies
        run: bash .github/ci/check-linux-deps.sh "$STAGE_DIR"

      - name: AppImage
        run: bash .github/ci/package-linux.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.PKG_NAME }}.AppImage
          archive: false
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v8 leaves the unarchived artifacts as they are
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A draft: published by hand once the packages have been tried
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f
          # Wherever the download put them
          mapfile -t packages < <(find dist -type f)
          gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Regard3D $GITHUB_REF_NAME" \
            --generate-notes \
            --draft \
            --verify-tag
